<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Очередь наград</title>
<style>
  /* Страница для трансляции: фон прозрачный, лишнего текста нет. Пока очередь пуста, не видно ничего */
  html, body { margin: 0; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<script>
  // Страница держит связь с плагином; сами награды появятся здесь на следующем шаге
  const key = new URLSearchParams(location.search).get("key") || "";
  const source = new EventSource("/events?key=" + encodeURIComponent(key));
  source.onmessage = () => { };
</script>
</body>
</html>
