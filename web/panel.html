<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Очередь наград</title>
<style>
  /* Цвета те же, что в окне настроек плагина */
  :root {
    --window: #1d1f26; --base: #272a33; --border: #343846;
    --text: #ffffff; --muted: #a8a8a8;
    --button: #3c404d; --button-hover: #464b59; --button-border: #5b6273;
    --input: #1d1f26; --primary: #284cb8; --primary-hover: #476bd7;
    --ok-bg: #2f4a3d; --ok-border: #57906f; --ok: #8cd1a6;
    --bad-bg: #4b2f37; --bad-border: #9a5560; --bad: #e8929c;
    --frame: #7c9bff; --lift: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --window: #cdcdcd; --base: #e8e8e8; --border: #aeaeae;
    --text: #0a0a0a; --muted: #575757;
    --button: #f5f5f5; --button-hover: #fefefe; --button-border: #828282;
    --input: #fefefe; --primary: #8cb5ff; --primary-hover: #b2cfff;
    --ok-bg: #d8ebdf; --ok-border: #8dbb9e; --ok: #2e7d4f;
    --bad-bg: #f3dada; --bad-border: #cb8f8f; --bad: #b03a48;
    --frame: #6b9bff; --lift: rgba(0, 0, 0, .3);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  /* Док занимает всю высоту: сверху шапка, в середине очередь (прокручивается), снизу закреплена форма ручного добавления */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 14px/1.45 "Segoe UI", sans-serif; background: var(--window); color: var(--text); }
  header { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 12px 10px; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 12px; }
  h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--button); color: var(--text); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }
  label.theme { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  select, input, textarea, button { font: inherit; color: var(--text); border-radius: 4px; }
  select, button { background: var(--button); border: 1px solid var(--button); padding: 5px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled), select:hover { background: var(--button-hover); border-color: var(--button-border); }
  button:disabled { opacity: .55; cursor: default; }
  input, textarea, select.field { width: 100%; background: var(--input); border: 1px solid var(--button); padding: 6px 8px; }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--primary-hover); }
  textarea { resize: vertical; min-height: 56px; }

  .banner { margin: 0 0 12px; padding: 8px 12px; border-radius: 4px; background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad); }
  .banner[hidden] { display: none; }
  .empty { padding: 20px 14px; text-align: center; color: var(--muted); background: var(--base); border: 1px solid var(--border); border-radius: 4px; }
  .empty[hidden] { display: none; }

  .entry { background: var(--base); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
  .entry.current { background: var(--ok-bg); border-color: var(--ok-border); }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .time { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; }
  .who { color: var(--ok); font-weight: 700; overflow-wrap: anywhere; }
  .current .who { color: var(--text); font-size: 16px; }
  .rline { margin-top: 2px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
  .msg { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .start { background: var(--primary); border-color: var(--primary); }
  .start:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .done { background: var(--ok-bg); border-color: var(--ok-border); }
  .remove { background: var(--bad-bg); border-color: var(--bad-border); }
  .current-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ok); margin-bottom: 4px; }
  .qempty { color: var(--muted); font-size: 12px; padding: 0 2px 6px; }
  .group { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot-r { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

  /* внутри группы видно минимум три записи; если их больше, группа прокручивается, а не растягивается (высоту ставит скрипт) */
  .gbody { overflow-y: auto; overscroll-behavior: contain; }
  .gbody.scroll { padding-right: 4px; }

  /* закреплённая внизу полоса: свёрнута до одной строки, раскрытая закрывает часть очереди.
     И свёрнутая, и раскрытая обведены бледно-синей рамкой с синеватым фоном и тенью сверху, чтобы не сливаться с очередью */
  #addBar { flex: none; max-height: 75%; overflow-y: auto; border: 2px solid var(--frame); border-bottom-width: 0;
    background: color-mix(in srgb, var(--frame) 9%, var(--base)); box-shadow: 0 -8px 14px -6px var(--lift); }
  #addToggle { display: flex; align-items: center; justify-content: space-between; width: 100%; background: transparent; border: 0; border-radius: 0; padding: 10px 12px; font-weight: 600; text-align: left; }
  #addToggle:hover { background: color-mix(in srgb, var(--frame) 16%, var(--base)); }
  form { padding: 0 12px 12px; display: grid; gap: 8px; }
  form[hidden] { display: none; }
  form label { color: var(--muted); font-size: 12px; display: block; margin-bottom: 2px; }
  .primary { background: var(--primary); border-color: var(--primary); }
  .primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .note { color: var(--muted); font-size: 12px; min-height: 1.2em; }
  .note.bad { color: var(--bad); }
  .note.ok { color: var(--ok); }
</style>
<script>
  // Тема применяется до отрисовки, чтобы страница не мигала. Хранится в браузере дока; по умолчанию тёмная
  (function () {
    var theme = "dark";
    try { theme = localStorage.getItem("rq-panel-theme") === "light" ? "light" : "dark"; } catch (e) { }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
<header>
  <h1><span id="dot" class="dot" title="Связь с плагином"></span>Очередь наград <span id="count" class="count">0</span></h1>
  <label class="theme">Тема
    <select id="theme">
      <option value="dark">Тёмная</option>
      <option value="light">Светлая</option>
    </select>
  </label>
</header>

<main id="content">
  <div id="offline" class="banner" hidden>Нет связи с плагином. Страница переподключится сама.</div>
  <div id="empty" class="empty">Очередь пуста</div>
  <div id="list"></div>
</main>

<section id="addBar">
  <button id="addToggle" type="button" aria-expanded="false" aria-controls="addForm"><span>Добавить вручную</span><span id="chev" aria-hidden="true">▸</span></button>
  <form id="addForm" autocomplete="off" hidden>
    <div>
      <label for="reward">Награда</label>
      <select id="reward" class="field"></select>
    </div>
    <div id="customRow">
      <label for="custom">Название</label>
      <input id="custom" maxlength="100" placeholder="Например, Заказ техники">
    </div>
    <div id="queueRow">
      <label for="queue">Очередь</label>
      <select id="queue" class="field"></select>
    </div>
    <div>
      <label for="user">Ник (необязательно)</label>
      <input id="user" maxlength="50">
    </div>
    <div>
      <label for="input">Сообщение (необязательно)</label>
      <textarea id="input" maxlength="500"></textarea>
    </div>
    <div><button id="addButton" class="primary" type="submit">Добавить в очередь</button></div>
    <div id="addNote" class="note"></div>
  </form>
</section>

<script>
  const key = new URLSearchParams(location.search).get("key") || "";
  const q = "key=" + encodeURIComponent(key);
  const $ = (id) => document.getElementById(id);
  const OTHER = "__other__";

  // ---- тема ----
  const themeEl = $("theme");
  themeEl.value = document.documentElement.getAttribute("data-theme");
  themeEl.onchange = () => {
    document.documentElement.setAttribute("data-theme", themeEl.value);
    try { localStorage.setItem("rq-panel-theme", themeEl.value); } catch (e) { }
  };

  // ---- очередь ----
  function formatTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const time = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === new Date().toDateString()) return time;
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " + time;
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;   // только textContent: тексты зрителей не должны становиться HTML
    return e;
  }

  async function command(button, path, id) {
    button.disabled = true;
    try {
      const r = await fetch(path + "?" + q + "&id=" + encodeURIComponent(id), { method: "POST" });
      // 404: записи уже нет (убрали в другом месте), это не ошибка; состояние придёт по обычному каналу
      if (!r.ok && r.status !== 404) throw new Error(r.status);
    } catch (e) {
      button.disabled = false;
      $("offline").textContent = "Не удалось выполнить команду. Проверьте, что плагин работает.";
      $("offline").hidden = false;
    }
  }

  // Цвет награды (и очереди): один и тот же для одного названия, чтобы их легко различать
  const PALETTE = ["#7aa2ff", "#ff9ec7", "#ffc66e", "#7be0c3", "#c3a2ff", "#ff8b7a", "#9fd86e", "#6ec9ff"];
  function colorFor(text) {
    let h = 0;
    for (const ch of text) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function button(className, text, handler) {
    const b = el("button", className, text);
    b.onclick = () => handler(b);
    return b;
  }

  // Запись целиком: номер в своей очереди, ник, время, награда, сообщение и кнопки
  function entryCard(entry, number, isCurrent) {
    const card = el("article", "entry" + (isCurrent ? " current" : ""));
    if (isCurrent) card.append(el("div", "current-label", "Сейчас делаю"));

    const head = el("div", "head");
    head.append(el("span", "num", "№" + number));
    if (entry.user_name) head.append(el("span", "who", entry.user_name));
    if (entry.source === "manual") head.append(el("span", "tag", "вручную"));
    head.append(el("span", "time", formatTime(entry.redeemed_at)));
    card.append(head);

    const rline = el("div", "rline");
    const dot = el("span", "dot-r");
    dot.style.setProperty("--c", colorFor(entry.reward_title));
    rline.append(dot, document.createTextNode(entry.reward_title));
    card.append(rline);

    if (entry.user_input) card.append(el("div", "msg", entry.user_input));

    const actions = el("div", "actions");
    if (isCurrent) {
      actions.append(
        button("done", "Выполнено", (b) => command(b, "/api/done", entry.id)),
        button("", "Вернуть в очередь", (b) => command(b, "/api/release", entry.id)),
        button("remove", "Убрать", (b) => command(b, "/api/remove", entry.id)));
    } else {
      actions.append(
        button("start", "Делаю", (b) => command(b, "/api/start", entry.id)),
        button("done", "Выполнено", (b) => command(b, "/api/done", entry.id)),
        button("remove", "Убрать", (b) => command(b, "/api/remove", entry.id)));
    }
    card.append(actions);
    return card;
  }

  let queueList = [{ id: "main", name: "" }];
  function queueTitle(queue, index) {
    return queue.name || "Очередь " + (index + 1);
  }

  // Очереди по порядку из настроек. В каждой своя запись «Сейчас делаю» сверху (если есть) и своя нумерация с 1.
  // Заголовок очереди показывается, если очередей больше одной или у очереди есть название
  function renderEntries(state) {
    const entries = state.entries || [];
    queueList = state.queues && state.queues.length ? state.queues : [{ id: "main", name: "" }];
    const list = $("list");

    // прокрутка страницы и очередей сохраняется: состояние приходит на каждое изменение
    const pageScroll = $("content").scrollTop;
    const groupScroll = new Map([...document.querySelectorAll(".gbody")].map((b) => [b.dataset.group, b.scrollTop]));
    list.textContent = "";

    const byQueue = new Map(queueList.map((queue) => [queue.id, []]));
    entries.forEach((entry) => (byQueue.get(entry.queue_id) || byQueue.get(queueList[0].id)).push(entry));

    queueList.forEach((queue, index) => {
      const items = byQueue.get(queue.id);
      if (queueList.length > 1 || queue.name) {
        const header = el("div", "group");
        const dot = el("span", "dot-r");
        dot.style.setProperty("--c", PALETTE[index % PALETTE.length]);
        header.append(dot, document.createTextNode(queueTitle(queue, index) + " \u00b7 " + items.length));
        list.append(header);
      }

      const body = el("div", "gbody");
      body.dataset.group = queue.id;
      if (items.length === 0 && queueList.length > 1) body.append(el("div", "qempty", "Пусто"));
      items.forEach((entry, i) => body.append(entryCard(entry, i + 1, entry.in_progress && i === 0)));
      list.append(body);
    });

    $("empty").hidden = entries.length > 0;
    $("count").textContent = String(entries.length);
    limitGroups();

    $("content").scrollTop = pageScroll;
    document.querySelectorAll(".gbody").forEach((b) => { b.scrollTop = groupScroll.get(b.dataset.group) || 0; });
  }

  // В группе всегда видны минимум три записи; если их больше, высота группы равна высоте первых трёх, остальные
  // доступны прокруткой внутри группы. Так одна длинная очередь не вытесняет остальные группы за край дока
  const VISIBLE_ENTRIES = 3;
  function limitGroups() {
    document.querySelectorAll(".gbody").forEach((body) => {
      body.style.maxHeight = "";
      body.classList.remove("scroll");
      const cards = body.children;
      if (cards.length <= VISIBLE_ENTRIES) return;
      const third = cards[VISIBLE_ENTRIES - 1];
      // нижний край третьей записи вместе с отступом под ней
      const height = third.getBoundingClientRect().bottom - body.getBoundingClientRect().top + parseFloat(getComputedStyle(third).marginBottom || "0");
      body.style.maxHeight = Math.ceil(height) + "px";
      body.classList.add("scroll");
    });
  }
  window.addEventListener("resize", limitGroups);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(limitGroups);

  // ---- ручное добавление ----
  // Награда из списка сама определяет очередь; для своего названия очередь выбирается (если их больше одной)
  let formKey = null;
  function renderRewards(state) {
    const rewards = state.rewards || [];
    const signature = JSON.stringify([rewards, queueList.map((x) => [x.id, x.name])]);
    if (signature === formKey) return;   // ничего не менялось: форму не трогаем, чтобы не сбить ввод
    formKey = signature;

    const select = $("reward");
    const previous = select.value;
    select.textContent = "";
    rewards.forEach((r) => {
      const option = el("option", "", r.title || r.id);
      option.value = r.id;
      select.append(option);
    });
    const other = el("option", "", rewards.length ? "Другое…" : "Своё название");
    other.value = OTHER;
    select.append(other);
    if ([...select.options].some((o) => o.value === previous)) select.value = previous;

    const queueSelect = $("queue");
    const previousQueue = queueSelect.value;
    queueSelect.textContent = "";
    queueList.forEach((queue, index) => {
      const option = el("option", "", queueTitle(queue, index));
      option.value = queue.id;
      queueSelect.append(option);
    });
    if ([...queueSelect.options].some((o) => o.value === previousQueue)) queueSelect.value = previousQueue;

    updateCustomRow();
  }

  function updateCustomRow() {
    const custom = $("reward").value === OTHER;
    $("customRow").hidden = !custom;
    $("queueRow").hidden = !custom || queueList.length <= 1;
  }
  $("reward").onchange = updateCustomRow;

  // Форма закреплена внизу и по умолчанию свёрнута (одна строка с названием и значком раскрытия)
  $("addToggle").onclick = () => {
    const open = $("addForm").hidden;
    $("addForm").hidden = !open;
    $("addToggle").setAttribute("aria-expanded", String(open));
    $("addBar").classList.toggle("open", open);
    $("chev").textContent = open ? "\u25BE" : "\u25B8";
    if (open) $("addBar").scrollTop = 0;
  };

  $("addForm").onsubmit = async (event) => {
    event.preventDefault();
    const custom = $("reward").value === OTHER;
    const select = $("reward");
    const title = custom ? $("custom").value.trim() : select.options[select.selectedIndex].textContent;
    const note = $("addNote");
    if (!title) {
      note.className = "note bad";
      note.textContent = "Укажите название награды.";
      return;
    }

    $("addButton").disabled = true;
    try {
      const r = await fetch("/api/add?" + q, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title,
          user: $("user").value,
          input: $("input").value,
          reward_id: custom ? "" : select.value,
          queue_id: custom ? $("queue").value : ""
        })
      });
      if (!r.ok) throw new Error(r.status);
      $("user").value = "";
      $("input").value = "";
      note.className = "note ok";
      note.textContent = "Добавлено.";
      setTimeout(() => { if (note.textContent === "Добавлено.") note.textContent = ""; }, 3000);
    } catch (e) {
      note.className = "note bad";
      note.textContent = "Не удалось добавить запись.";
    } finally {
      $("addButton").disabled = false;
    }
  };

  // ---- связь с плагином ----
  function connect() {
    const source = new EventSource("/events?" + q);
    source.onopen = () => { $("dot").classList.add("on"); $("offline").hidden = true; };
    source.onerror = () => { $("dot").classList.remove("on"); $("offline").textContent = "Нет связи с плагином. Страница переподключится сама."; $("offline").hidden = false; };
    source.onmessage = (e) => {
      let message;
      try { message = JSON.parse(e.data); } catch (err) { return; }
      if (message.type !== "state") return;
      renderEntries(message);
      renderRewards(message);
    };
  }
  connect();
</script>
</body>
</html>
