<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Очередь наград</title>
<style>
  /* Цвета те же, что в окне настроек плагина */
  :root {
    --window: #1d1f26; --base: #272a33; --border: #343846;
    --text: #ffffff; --muted: #a8a8a8;
    --button: #3c404d; --button-hover: #464b59; --button-border: #5b6273;
    --input: #1d1f26; --primary: #284cb8; --primary-hover: #476bd7;
    --ok-bg: #2f4a3d; --ok-border: #57906f; --ok: #8cd1a6;
    --bad-bg: #4b2f37; --bad-border: #9a5560; --bad: #e8929c;
    --frame: #7c9bff;
    --scroll: #3c404d; --scroll-hover: #5b6273;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --window: #cdcdcd; --base: #e8e8e8; --border: #aeaeae;
    --text: #0a0a0a; --muted: #575757;
    --button: #f5f5f5; --button-hover: #fefefe; --button-border: #828282;
    --input: #fefefe; --primary: #8cb5ff; --primary-hover: #b2cfff;
    --ok-bg: #d8ebdf; --ok-border: #8dbb9e; --ok: #2e7d4f;
    --bad-bg: #f3dada; --bad-border: #cb8f8f; --bad: #b03a48;
    --frame: #6b9bff;
    --scroll: #b3b3b3; --scroll-hover: #8f8f8f;
    color-scheme: light;
  }
  * { box-sizing: border-box; }

  /* Тонкие полосы прокрутки, как в OBS: узкая скруглённая «ручка» без стрелок и фона */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; min-height: 28px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); background-clip: padding-box; border: 2px solid transparent; }
  ::-webkit-scrollbar-corner { background: transparent; }

  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 14px/1.45 "Segoe UI", sans-serif; background: var(--window); color: var(--text); }
  header { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 12px 10px; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px 12px; }
  h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--button); color: var(--text); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }
  label.theme { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  select, input, textarea, button { font: inherit; color: var(--text); border-radius: 4px; }
  select, button { background: var(--button); border: 1px solid var(--button); padding: 5px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled), select:hover { background: var(--button-hover); border-color: var(--button-border); }
  button:disabled { opacity: .55; cursor: default; }
  input, textarea, select.field { width: 100%; background: var(--input); border: 1px solid var(--button); padding: 6px 8px; }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--primary-hover); }
  textarea { resize: vertical; min-height: 56px; }

  .banner { margin: 0 0 12px; padding: 8px 12px; border-radius: 4px; background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad); }
  .banner[hidden] { display: none; }

  /* очередь: строка с названием (сворачивает очередь) и кнопкой «Добавить», под ней записи и форма добавления */
  .queue { margin-bottom: 14px; }
  .qhead { display: flex; align-items: center; gap: 6px; border: 2px solid var(--frame); border-radius: 4px; background: color-mix(in srgb, var(--frame) 9%, var(--base)); }
  .qtoggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: transparent; border: 0; border-radius: 0; padding: 9px 10px; font-weight: 600; text-align: left; }
  .qtoggle:hover { background: color-mix(in srgb, var(--frame) 16%, var(--base)); }
  .qname { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qcount { color: var(--muted); font-weight: 400; }
  .chev { color: var(--muted); width: 1em; flex: none; }
  .qadd { flex: none; margin: 4px 6px 4px 0; padding: 4px 11px; }
  .collapsed .qbody { display: none; }
  .qbody { padding-top: 8px; }
  .qempty { color: var(--muted); font-size: 12px; padding: 0 2px 8px; }
  .dot-r { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

  .entry { background: var(--base); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
  .entry.current { background: var(--ok-bg); border-color: var(--ok-border); }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .time { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; }
  .who { color: var(--ok); font-weight: 700; overflow-wrap: anywhere; }
  .current .who { color: var(--text); font-size: 16px; }
  .rline { margin-top: 2px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
  .msg { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .start { background: var(--primary); border-color: var(--primary); }
  .start:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .done { background: var(--ok-bg); border-color: var(--ok-border); }
  .remove, .closebtn { background: var(--bad-bg); border-color: var(--bad-border); }
  .current-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ok); margin-bottom: 4px; }

  /* когда очередей несколько, в каждой видны минимум три записи, остальные прокручиваются внутри очереди (высоту ставит скрипт) */
  .gbody { overflow-y: auto; overscroll-behavior: contain; }
  .gbody.scroll { padding-right: 2px; }

  /* форма добавления под списком очереди, обведена той же рамкой, что и строка очереди */
  .addform { margin-top: 6px; padding: 10px; display: grid; gap: 8px; border: 2px solid var(--frame); border-radius: 4px; background: color-mix(in srgb, var(--frame) 9%, var(--base)); }
  .addform[hidden] { display: none; }
  .addform label { color: var(--muted); font-size: 12px; display: block; margin-bottom: 2px; }
  .toprow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
  .closebtn { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; }
  .closebtn:hover:not(:disabled) { background: var(--bad-bg); border-color: var(--bad); }
  .closebtn svg { width: 12px; height: 12px; display: block; }
  .primary { background: var(--primary); border-color: var(--primary); }
  .primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .note { color: var(--muted); font-size: 12px; min-height: 1.2em; }
  .note.bad { color: var(--bad); }
  .note.ok { color: var(--ok); }
</style>
<script>
  // Тема применяется до отрисовки, чтобы страница не мигала. Хранится в браузере дока; по умолчанию тёмная
  (function () {
    var theme = "dark";
    try { theme = localStorage.getItem("rq-panel-theme") === "light" ? "light" : "dark"; } catch (e) { }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
<header>
  <h1><span id="dot" class="dot" title="Связь с плагином"></span>Очередь наград <span id="count" class="count">0</span></h1>
  <label class="theme">Тема
    <select id="theme">
      <option value="dark">Тёмная</option>
      <option value="light">Светлая</option>
    </select>
  </label>
</header>

<main id="content">
  <div id="offline" class="banner" hidden>Нет связи с плагином. Страница переподключится сама.</div>
  <div id="list"></div>
</main>

<script>
  const key = new URLSearchParams(location.search).get("key") || "";
  const q = "key=" + encodeURIComponent(key);
  const $ = (id) => document.getElementById(id);
  const OTHER = "__other__";
  const CLOSE_ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>';

  // ---- тема ----
  const themeEl = $("theme");
  themeEl.value = document.documentElement.getAttribute("data-theme");
  themeEl.onchange = () => {
    document.documentElement.setAttribute("data-theme", themeEl.value);
    try { localStorage.setItem("rq-panel-theme", themeEl.value); } catch (e) { }
  };

  function formatTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const time = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    if (d.toDateString() === new Date().toDateString()) return time;
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " + time;
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;   // только textContent: тексты зрителей не должны становиться HTML
    return e;
  }

  async function command(button, path, id) {
    button.disabled = true;
    try {
      const r = await fetch(path + "?" + q + "&id=" + encodeURIComponent(id), { method: "POST" });
      // 404: записи уже нет (убрали в другом месте), это не ошибка; состояние придёт по обычному каналу
      if (!r.ok && r.status !== 404) throw new Error(r.status);
    } catch (e) {
      button.disabled = false;
      $("offline").textContent = "Не удалось выполнить команду. Проверьте, что плагин работает.";
      $("offline").hidden = false;
    }
  }

  // Цвет награды (и очереди): один и тот же для одного названия, чтобы их легко различать
  const PALETTE = ["#7aa2ff", "#ff9ec7", "#ffc66e", "#7be0c3", "#c3a2ff", "#ff8b7a", "#9fd86e", "#6ec9ff"];
  function colorFor(text) {
    let h = 0;
    for (const ch of text) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function button(className, text, handler) {
    const b = el("button", className, text);
    b.onclick = () => handler(b);
    return b;
  }

  // Запись целиком: номер в своей очереди, ник, время, награда, сообщение и кнопки
  function entryCard(entry, number, isCurrent) {
    const card = el("article", "entry" + (isCurrent ? " current" : ""));
    if (isCurrent) card.append(el("div", "current-label", "Сейчас делаю"));

    const head = el("div", "head");
    head.append(el("span", "num", "№" + number));
    if (entry.user_name) head.append(el("span", "who", entry.user_name));
    if (entry.source === "manual") head.append(el("span", "tag", "вручную"));
    head.append(el("span", "time", formatTime(entry.redeemed_at)));
    card.append(head);

    const rline = el("div", "rline");
    const dot = el("span", "dot-r");
    dot.style.setProperty("--c", colorFor(entry.reward_title));
    rline.append(dot, document.createTextNode(entry.reward_title));
    card.append(rline);

    if (entry.user_input) card.append(el("div", "msg", entry.user_input));

    const actions = el("div", "actions");
    if (isCurrent) {
      actions.append(
        button("done", "Выполнено", (b) => command(b, "/api/done", entry.id)),
        button("", "Вернуть в очередь", (b) => command(b, "/api/release", entry.id)),
        button("remove", "Убрать", (b) => command(b, "/api/remove", entry.id)));
    } else {
      actions.append(
        button("start", "Делаю", (b) => command(b, "/api/start", entry.id)),
        button("done", "Выполнено", (b) => command(b, "/api/done", entry.id)),
        button("remove", "Убрать", (b) => command(b, "/api/remove", entry.id)));
    }
    card.append(actions);
    return card;
  }

  // ---- очереди ----
  // У каждой очереди свой блок, который создаётся один раз и потом только обновляется: форма добавления внутри него
  // не пересоздаётся, поэтому набранный текст и фокус не теряются, когда приходит новый заказ
  let queueList = [{ id: "main", name: "" }];
  let rewardTitles = new Map();
  const sections = new Map();

  function loadCollapsed() {
    try { return new Set(JSON.parse(localStorage.getItem("rq-collapsed") || "[]")); } catch (e) { return new Set(); }
  }
  const collapsed = loadCollapsed();
  function saveCollapsed() {
    try { localStorage.setItem("rq-collapsed", JSON.stringify([...collapsed])); } catch (e) { }
  }

  function queueTitle(queue, index) {
    return queue.name || (queueList.length > 1 ? "Очередь " + (index + 1) : "Очередь");
  }

  function setCollapsed(s, value) {
    if (value) collapsed.add(s.queueId); else collapsed.delete(s.queueId);
    saveCollapsed();
    applyCollapsed(s);
    limitGroups();
  }

  function applyCollapsed(s) {
    const isCollapsed = collapsed.has(s.queueId);
    s.section.classList.toggle("collapsed", isCollapsed);
    s.chev.textContent = isCollapsed ? "▸" : "▾";
    s.toggle.setAttribute("aria-expanded", String(!isCollapsed));
  }

  function createSection(queue) {
    const section = el("section", "queue");
    const head = el("div", "qhead");
    const toggle = el("button", "qtoggle");
    toggle.type = "button";
    const chev = el("span", "chev");
    const dot = el("span", "dot-r");
    const name = el("span", "qname");
    const count = el("span", "qcount");
    toggle.append(chev, dot, name, count);
    const add = el("button", "qadd primary", "+ Добавить");
    add.type = "button";
    head.append(toggle, add);

    const body = el("div", "qbody");
    const gbody = el("div", "gbody");
    gbody.dataset.group = queue.id;
    const form = buildForm(queue.id);
    body.append(gbody, form.el);
    section.append(head, body);

    const s = { queueId: queue.id, section, toggle, chev, dot, name, count, gbody, form, add };
    toggle.onclick = () => setCollapsed(s, !collapsed.has(queue.id));
    // «Добавить» раскрывает форму под списком этой очереди (и саму очередь, если она свёрнута); повторное нажатие закрывает
    add.onclick = () => {
      if (form.el.hidden) {
        if (collapsed.has(queue.id)) setCollapsed(s, false);
        form.el.hidden = false;
        updateCustomRow(form);
        (form.customRow.hidden ? form.select : form.custom).focus();
      } else {
        form.el.hidden = true;
      }
    };
    sections.set(queue.id, s);
    return s;
  }

  // ---- форма добавления (у каждой очереди своя) ----
  function buildForm(queueId) {
    const formEl = el("form", "addform");
    formEl.hidden = true;
    formEl.autocomplete = "off";

    const select = el("select", "field");
    const close = el("button", "closebtn");
    close.type = "button";
    close.title = "Закрыть";
    close.setAttribute("aria-label", "Закрыть форму");
    close.innerHTML = CLOSE_ICON;   // постоянная разметка значка, не данные зрителей

    const top = el("div", "toprow");
    const rewardBox = el("div");
    rewardBox.append(el("label", "", "Награда"), select);
    top.append(rewardBox, close);

    const custom = el("input");
    custom.maxLength = 100;
    custom.placeholder = "Например, Заказ техники";
    const customRow = el("div");
    customRow.append(el("label", "", "Название"), custom);

    const user = el("input");
    user.maxLength = 50;
    const userRow = el("div");
    userRow.append(el("label", "", "Ник (необязательно)"), user);

    const input = el("textarea");
    input.maxLength = 500;
    const inputRow = el("div");
    inputRow.append(el("label", "", "Сообщение (необязательно)"), input);

    const submit = el("button", "primary", "Добавить в очередь");
    submit.type = "submit";
    const note = el("div", "note");
    const submitRow = el("div");
    submitRow.append(submit);

    formEl.append(top, customRow, userRow, inputRow, submitRow, note);

    const form = { el: formEl, select, close, custom, customRow, user, input, submit, note, rewardsKey: null };
    select.onchange = () => updateCustomRow(form);
    close.onclick = () => { formEl.hidden = true; };
    formEl.onsubmit = async (event) => {
      event.preventDefault();
      const isCustom = select.value === OTHER;
      const title = isCustom ? custom.value.trim() : select.options[select.selectedIndex].textContent;
      if (!title) {
        note.className = "note bad";
        note.textContent = "Укажите название награды.";
        return;
      }

      submit.disabled = true;
      try {
        const r = await fetch("/api/add?" + q, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, user: user.value, input: input.value, reward_id: isCustom ? "" : select.value, queue_id: queueId })
        });
        if (!r.ok) throw new Error(r.status);
        user.value = "";
        input.value = "";
        note.className = "note ok";
        note.textContent = "Добавлено.";
        setTimeout(() => { if (note.textContent === "Добавлено.") note.textContent = ""; }, 3000);
      } catch (e) {
        note.className = "note bad";
        note.textContent = "Не удалось добавить запись.";
      } finally {
        submit.disabled = false;
      }
    };
    return form;
  }

  function updateCustomRow(form) {
    form.customRow.hidden = form.select.value !== OTHER;
  }

  // Награды в списке формы только этой очереди: куда добавлять, определяется самой очередью
  function updateForm(s, queue) {
    const form = s.form;
    const rewards = (queue.reward_ids || []).map((id) => ({ id, title: rewardTitles.get(id) || id }));
    const signature = JSON.stringify(rewards);
    if (signature === form.rewardsKey) return;   // список не менялся: не трогаем форму, чтобы не сбить ввод
    form.rewardsKey = signature;

    const previous = form.select.value;
    form.select.textContent = "";
    rewards.forEach((r) => {
      const option = el("option", "", r.title);
      option.value = r.id;
      form.select.append(option);
    });
    const other = el("option", "", rewards.length ? "Другое…" : "Своё название");
    other.value = OTHER;
    form.select.append(other);
    if ([...form.select.options].some((o) => o.value === previous)) form.select.value = previous;
    updateCustomRow(form);
  }

  // Очереди по порядку из настроек. В каждой своя запись «Сейчас делаю» сверху (если есть) и своя нумерация с 1
  function renderEntries(state) {
    const entries = state.entries || [];
    queueList = state.queues && state.queues.length ? state.queues : [{ id: "main", name: "" }];
    rewardTitles = new Map((state.rewards || []).map((r) => [r.id, r.title]));
    const list = $("list");

    // прокрутка страницы и очередей сохраняется: состояние приходит на каждое изменение
    const pageScroll = $("content").scrollTop;
    const groupScroll = new Map([...sections].map(([id, s]) => [id, s.gbody.scrollTop]));

    // удалённых очередей на странице больше нет
    for (const [id, s] of [...sections]) {
      if (!queueList.some((x) => x.id === id)) {
        s.section.remove();
        sections.delete(id);
      }
    }

    const byQueue = new Map(queueList.map((queue) => [queue.id, []]));
    entries.forEach((entry) => (byQueue.get(entry.queue_id) || byQueue.get(queueList[0].id)).push(entry));

    queueList.forEach((queue, index) => {
      const s = sections.get(queue.id) || createSection(queue);
      if (list.children[index] !== s.section) list.insertBefore(s.section, list.children[index] || null);

      const items = byQueue.get(queue.id);
      s.name.textContent = queueTitle(queue, index);
      s.count.textContent = "· " + items.length;
      s.dot.style.setProperty("--c", PALETTE[index % PALETTE.length]);
      applyCollapsed(s);

      s.gbody.textContent = "";
      if (items.length === 0) s.gbody.append(el("div", "qempty", "Пусто"));
      items.forEach((entry, i) => s.gbody.append(entryCard(entry, i + 1, entry.in_progress && i === 0)));
      updateForm(s, queue);
    });

    $("count").textContent = String(entries.length);
    limitGroups();

    $("content").scrollTop = pageScroll;
    sections.forEach((s, id) => { s.gbody.scrollTop = groupScroll.get(id) || 0; });
  }

  // Когда очередей несколько, в каждой видны минимум три записи; если их больше, высота очереди равна высоте первых трёх,
  // остальные доступны прокруткой внутри очереди. Так одна длинная очередь не вытесняет остальные за край дока.
  // Если очередь одна, ограничения нет: список растёт, а прокручивается весь док
  const VISIBLE_ENTRIES = 3;
  function limitGroups() {
    sections.forEach((s) => {
      const body = s.gbody;
      body.style.maxHeight = "";
      body.classList.remove("scroll");
      if (queueList.length <= 1 || collapsed.has(s.queueId)) return;
      const cards = [...body.children].filter((c) => c.classList.contains("entry"));
      if (cards.length <= VISIBLE_ENTRIES) return;
      const third = cards[VISIBLE_ENTRIES - 1];
      // нижний край третьей записи вместе с отступом под ней
      const height = third.getBoundingClientRect().bottom - body.getBoundingClientRect().top + parseFloat(getComputedStyle(third).marginBottom || "0");
      body.style.maxHeight = Math.ceil(height) + "px";
      body.classList.add("scroll");
    });
  }
  window.addEventListener("resize", limitGroups);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(limitGroups);

  // ---- связь с плагином ----
  function connect() {
    const source = new EventSource("/events?" + q);
    source.onopen = () => { $("dot").classList.add("on"); $("offline").hidden = true; };
    source.onerror = () => { $("dot").classList.remove("on"); $("offline").textContent = "Нет связи с плагином. Страница переподключится сама."; $("offline").hidden = false; };
    source.onmessage = (e) => {
      let message;
      try { message = JSON.parse(e.data); } catch (err) { return; }
      if (message.type !== "state") return;
      renderEntries(message);
    };
  }
  connect();
</script>
</body>
</html>
